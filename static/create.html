  <script>
    function getStandardShedName(shedName) {
      if (!shedName) return "";
      const lowerShed = shedName.toLowerCase();
      if (lowerShed.includes("vadodara") || lowerShed.includes("vadodhara")) {
        return "Vadodara Loco Shed(BRC)";
      }
      if (lowerShed.includes("vatva")) {
        return "Vatva Loco Shed(VTA)";
      }
      return shedName;
    }

    window.addEventListener('load', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const locoId = urlParams.get("loco_id");

      if (locoId) {
        // Edit mode: fetch details and populate
        fetch(`getReportById?loco_id=${encodeURIComponent(locoId)}`)
          .then(response => response.json())
          .then(res => {
            if (res.success && res.data && res.data.locoDetails) {
              const details = res.data.locoDetails;
              localStorage.setItem("locoDetails", JSON.stringify(details));
              localStorage.setItem("selectedLocoId", locoId);
              
              showSection("0.0").then(() => {
                document.getElementById("loco-id").value = details.locoID || "";
                document.getElementById("loco-type").value = details.locoType || "";
                document.getElementById("brake-type").value = details.brakeType || "";
                document.getElementById("railway-division").value = details.railwayDivision || "";
                
                if (typeof window.updateShedNames === 'function') {
                  window.updateShedNames();
                }
                document.getElementById("shed-name").value = getStandardShedName(details.shedName || "");
                document.getElementById("date").value = details.inspectionDate || "";

                // Automatically trigger getDetails() to load observations & highlight sidebar
                getDetails();
              });
            } else {
              alert(res.message || "Failed to load locomotive details.");
              showSection("0.0");
            }
          })
          .catch(error => {
            console.error("Fetch error:", error);
            showSection("0.0");
          });
      } else {
        // Create/Back Navigation Mode: Check if we have active unsaved details to restore
        const storedLocoInfo = sessionStorage.getItem("locoInfo") || localStorage.getItem("locoDetails");
        
        if (storedLocoInfo) {
          const details = JSON.parse(storedLocoInfo);
          const normalized = {
            locoID: details.locoID || details.locoId || details.loco_id || "",
            locoType: details.locoType || details.loco_type || "",
            brakeType: details.brakeType || details.brake_type || "",
            railwayDivision: details.railwayDivision || details.railway_division || "",
            shedName: details.shedName || details.shed_name || "",
            inspectionDate: details.inspectionDate || details.inspection_date || details.inspection_Date || ""
          };

          const hash = window.location.hash || "#0.0";
          const sectionId = hash.substring(1);

          showSection(sectionId).then(() => {
            if (document.getElementById("loco-id")) document.getElementById("loco-id").value = normalized.locoID;
            if (document.getElementById("loco-type")) document.getElementById("loco-type").value = normalized.locoType;
            if (document.getElementById("brake-type")) document.getElementById("brake-type").value = normalized.brakeType;
            if (document.getElementById("railway-division")) document.getElementById("railway-division").value = normalized.railwayDivision;
            
            if (typeof window.updateShedNames === 'function') {
              window.updateShedNames();
            }
            if (document.getElementById("shed-name")) document.getElementById("shed-name").value = getStandardShedName(normalized.shedName);
            if (document.getElementById("date")) document.getElementById("date").value = normalized.inspectionDate;
          });
        } else {
          // Clean fresh start (no saved details)
          sessionStorage.removeItem("locoDetails");
          sessionStorage.removeItem("observationsData");
          localStorage.removeItem("selectedLocoId");
          localStorage.removeItem("locoDetails");
          sessionStorage.removeItem("locoInfo");

          const hash = window.location.hash || "#0.0";
          const sectionId = hash.substring(1);
          showSection(sectionId).then(() => {
            const fieldIds = ["loco-id", "loco-type", "brake-type", "railway-division", "shed-name", "date"];
            fieldIds.forEach(id => {
              const element = document.getElementById(id);
              if (element) element.value = "";
            });
          });
        }
      }
    });
  </script>

  <script>

function confirmGenerateReport() {
  const userConfirmed = confirm("Do you want to generate the report?");
  if (userConfirmed) {
    generateReport(); // Call your actual function
  }
}

 function beforeUnloadHandler(event) {
  event.returnValue = "Please generate report before closing.";
  return event.returnValue;
}
window.addEventListener("beforeunload", beforeUnloadHandler);



  </script>
  
  <!-- Additional scripts (for loco info handling, etc.) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      const locoId = urlParams.get("loco_id");
      if (locoId) {
        localStorage.setItem("selectedLocoId", locoId);
        // Set current date if necessary.
        const dateElem = document.getElementById("date");
        if (dateElem) {
          const now = new Date();
          const year = now.getFullYear();
          const month = String(now.getMonth() + 1).padStart(2, "0");
          const day = String(now.getDate()).padStart(2, "0");
          dateElem.value = `${year}-${month}-${day}`;
        }
        fetch(`getReportById?loco_id=${locoId}`)
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              const locoInfo = data.data.locoDetails;
              if (locoInfo) {
                localStorage.setItem("locoDetails", JSON.stringify(locoInfo));
                const locoIdElem = document.getElementById("loco-id");
                if (locoIdElem) locoIdElem.value = locoInfo.locoID || "";
                const locoTypeElem = document.getElementById("loco-type");
                if (locoTypeElem) locoTypeElem.value = locoInfo.locoType || "";
                const brakeTypeElem = document.getElementById("brake-type");
                if (brakeTypeElem) brakeTypeElem.value = locoInfo.brakeType || "";
                const divisionElem = document.getElementById("railway-division");
                if (divisionElem) divisionElem.value = locoInfo.railwayDivision || "";
                const shedElem = document.getElementById("shed-name");
                if (shedElem) shedElem.value = locoInfo.shedName || "";
              }
            } else {
              console.error("Error fetching report details:", data.message);
            }
          })
          .catch(error => console.error("Fetch error:", error));
      } else {
        localStorage.removeItem("locoDetails");
        const stored = localStorage.getItem("locoDetails");
        if (stored) {
          const locoInfo = JSON.parse(stored);
          const locoIdElem = document.getElementById("loco-id");
          if (locoIdElem) locoIdElem.value = locoInfo.locoID || "";
          const locoTypeElem = document.getElementById("loco-type");
          if (locoTypeElem) locoTypeElem.value = locoInfo.locoType || "";
          const brakeTypeElem = document.getElementById("brake-type");
          if (brakeTypeElem) brakeTypeElem.value = locoInfo.brakeType || "";
          const divisionElem = document.getElementById("railway-division");
          if (divisionElem) divisionElem.value = locoInfo.railwayDivision || "";
          const shedElem = document.getElementById("shed-name");
          if (shedElem) shedElem.value = locoInfo.shedName || "";
          const dateElem = document.getElementById("date");
          if (dateElem && locoInfo.inspectionDate) {
            const d = new Date(locoInfo.inspectionDate);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            dateElem.value = `${year}-${month}-${day}`;
          }
        }
      }
    });
  </script>
