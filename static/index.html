<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Audit Report</title>
  <style>
    /* General Body Style */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f9;
    }

    /* Background image and left side style */
    .background {
      background-image: url('audit.jpg'); /* Adjust with correct path */
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 60%;
      filter: brightness(0.7);
    }

    /* Content Section on the Right */
    .content {
      width: 40%;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 20px;
      font-weight: bold;
    }

    p {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 30px;
    }

    /* Button Styling */
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    button {
      padding: 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    button:hover {
      background-color: #45a049;
    }

    /* Logout Button Style */
    .acto-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logout-button {
      background-color: blue;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .logout-button:hover {
      background-color: darkblue;
    }

    /* Modal Overlay Style */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #fff;
      margin: auto;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      position: relative;
      text-align: center;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }

    /* PDF option buttons in modal */
    .pdf-option {
      display: block;
      margin: 15px auto;
      padding: 12px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      width: 80%;
      max-width: 400px;
    }
    
    .pdf-option:hover {
      background-color: #0056b3;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .background {
        width: 100%;
        height: 50%;
      }
      .content {
        width: 100%;
        height: 50%;
        padding: 20px;
      }
      h1 {
        font-size: 2rem;
      }
      p {
        font-size: 1rem;
      }
      button {
        font-size: 16px;
      }
      .acto-buttons {
        top: 10px;
        right: 10px;
      }
      .logout-button {
        font-size: 14px;
        padding: 8px 12px;
      }
    }

.modal-flex-container {
  background: white;
  margin: auto;
  padding: 20px;
  border-radius: 8px;
  width: 90%;
  max-width: 1200px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 40px;
  max-height: 80vh;
  overflow-y: auto;
}

.column {

  min-width: 300px;
}

.pdf-option {
  display: block;

  text-align: left;
  padding: 10px;
  margin-bottom: 5px;
  font-family: sans-serif;
  font-size: 14px;
  white-space: normal;
  border: none;

    /* Loader Spinner */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #6f42c1;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 2s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
</style>

<!-- Modal for Update Status -->

      Checking for updates...

  <script>
    function triggerDBMigration() {
      const modal = document.getElementById('updateModal');
      const statusText = document.getElementById('updateStatusText');
      modal.style.display = 'flex';
      statusText.innerHTML = '<span class="loader"></span> Running database migration and checklist sync... Please wait.';
      
      fetch('db_migration')
        .then(response => response.text())
        .then(data => {
          statusText.innerHTML = data;
        })
        .catch(error => {
          statusText.innerHTML = '<span style="color: red;">Failed to run updates: ' + error + '</span>';
        });
    }

    function hideUpdateModal() {
      document.getElementById('updateModal').style.display = 'none';
    }




 
function createNewReport() {
  // Preserve the user ID and employee name before clearing storage.
  const storedUserId = localStorage.getItem("user_id");
  const storedEmployeeName = localStorage.getItem("employee_name");

  // Clear all storage.
  sessionStorage.clear();
  localStorage.clear();

  // Restore the preserved values.
  if (storedUserId) {
    localStorage.setItem("user_id", storedUserId);
  }
  if (storedEmployeeName) {
    localStorage.setItem("employee_name", storedEmployeeName);
  }

  // Redirect to create.html with the default section.
  window.location.href = 'create.html#0.0';
}





    
    function showCreateReportModal() {
      document.getElementById('createReportModal').style.display = 'flex';
    }

    function hideCreateReportModal() {
      document.getElementById('createReportModal').style.display = 'none';
    }

    function showViewReportModal() {
      document.getElementById('viewReportModal').style.display = 'flex';
    }

    function hideViewReportModal() {
      document.getElementById('viewReportModal').style.display = 'none';
    }

    function createStandardReport() {
      const storedUserId = localStorage.getItem("user_id");
      const storedEmployeeName = localStorage.getItem("employee_name");

      sessionStorage.clear();
      localStorage.clear();

      if (storedUserId) localStorage.setItem("user_id", storedUserId);
      if (storedEmployeeName) localStorage.setItem("employee_name", storedEmployeeName);

      window.location.href = 'create.html#0.0';
    }

    function createHhpReport() {
      const storedUserId = localStorage.getItem("user_id");
      const storedEmployeeName = localStorage.getItem("employee_name");

      sessionStorage.clear();
      localStorage.clear();

      if (storedUserId) localStorage.setItem("user_id", storedUserId);
      if (storedEmployeeName) localStorage.setItem("employee_name", storedEmployeeName);

      window.location.href = 'create_hhp.html#0.0';
    }

    function openViewReports() {
      const userId = localStorage.getItem("user_id") || "";
      const role = localStorage.getItem("role") || "";
      let url = 'viewReports';
      const params = [];
      if (userId) params.push('user_id=' + encodeURIComponent(userId));
      if (role) params.push('role=' + encodeURIComponent(role));
      if (params.length) url += '?' + params.join('&');
      window.location.href = url;
    }

    function openViewHhpReports() {
      const userId = localStorage.getItem("user_id") || "";
      const role = localStorage.getItem("role") || "";
      let url = 'viewHhpReports';
      const params = [];
      if (userId) params.push('user_id=' + encodeURIComponent(userId));
      if (role) params.push('role=' + encodeURIComponent(role));
      if (params.length) url += '?' + params.join('&');
      window.location.href = url;
    }

    function viewReport() {
      showViewReportModal();
    }
    function _unused_viewReport() {
      const userId = localStorage.getItem("user_id") || "";
      window.location.href = userId ? 'viewReports?user_id=' + encodeURIComponent(userId) : 'viewReports';
    }

    function logout() {
      alert("Logging out...");
      window.location.href = 'login.html';
    }

    // Open the manual PDF in a new tab
    function openManual(filePath) {
      window.open(filePath, '_blank');
    }

    // Show the modal with manual options
    function showManualModal() {
      document.getElementById('manualModal').style.display = 'flex';
    }

    // Hide the modal
    function hideManualModal() {
      document.getElementById('manualModal').style.display = 'none';
    }

    // Hide modal if user clicks outside the modal content
    window.onclick = function(event) {
      const manualModal = document.getElementById('manualModal');
      const createModal = document.getElementById('createReportModal');
      const viewModal = document.getElementById('viewReportModal');
      if (event.target === manualModal) manualModal.style.display = 'none';
      if (event.target === createModal) createModal.style.display = 'none';
      if (event.target === viewModal) viewModal.style.display = 'none';
    }
  </script>
